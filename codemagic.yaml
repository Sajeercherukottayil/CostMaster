# Cloud builds on Codemagic (https://codemagic.io), so the iPhone app can be
# built without a Mac. Connect the GitHub repository in Codemagic, then start
# one of these workflows.
workflows:
  # Checks that the iPhone app compiles. Needs no Apple account.
  ios-check:
    name: iOS build check (unsigned)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Run tests
        script: flutter test
      - name: Build iOS (no code signing)
        script: flutter build ios --release --no-codesign

  # Builds a signed app and uploads it to TestFlight / App Store Connect.
  # Needs an Apple Developer account and an App Store Connect API key added in
  # Codemagic under Teams > Integrations, named "CostMaster ASC key".
  ios-release:
    name: iOS release (TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: CostMaster ASC key
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.costmaster.costMaster
      vars:
        # The app's Apple ID from App Store Connect > App Information.
        APP_STORE_APPLE_ID: 0000000000
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Run tests
        script: flutter test
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          BUILD_NUMBER=$(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID") + 1))
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
