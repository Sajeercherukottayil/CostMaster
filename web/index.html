<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Mock tests for CMA Foundation and Intermediate students.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#1E40AF">
  <meta name="apple-mobile-web-app-title" content="CostMaster">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>CostMaster</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Shown while the app downloads on first visit; the app draws over it. */
    html, body { margin: 0; height: 100%; background: #1E40AF; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      color: #fff; font-family: -apple-system, system-ui, sans-serif;
    }
    #loading b { font-size: 28px; }
    #loading span { opacity: .8; font-size: 15px; }
    #loading i {
      width: 32px; height: 32px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,.3); border-top-color: #fff;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading nav { position: absolute; bottom: 24px; display: flex; flex-wrap: wrap;
      justify-content: center; gap: 4px 16px; padding: 0 16px; font-size: 13px; }
    #loading nav a { color: #fff; opacity: .85; }
  </style>
</head>
<body>
  <div id="loading">
    <b>CostMaster</b><i></i><span>Loading…</span>
    <!-- Plain links, for visitors and reviewers that do not run the app. -->
    <nav>
      <a href="/download">Download</a>
      <a href="/pricing">Pricing</a>
      <a href="/terms">Terms &amp; Conditions</a>
      <a href="/privacy">Privacy Policy</a>
      <a href="/refund">Refund &amp; Cancellation</a>
      <a href="/contact">Contact Us</a>
    </nav>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) el.remove();
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- Razorpay Checkout, used to buy Premium on the website. -->
  <script src="https://checkout.razorpay.com/v1/checkout.js" async></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
